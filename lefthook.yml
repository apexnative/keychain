pre-commit:
  parallel: true
  commands:
    lint:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn eslint {staged_files}
    types:
      glob: '*.{js,ts,jsx,tsx}'
      run: yarn tsc
    license-headers:
      run: node scripts/check-license-headers.mjs
commit-msg:
  parallel: true
  commands:
    commitlint:
      run: yarn commitlint --edit
